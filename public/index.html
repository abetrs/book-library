<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library</title>
<meta name="description" content="A self-hosted personal library. Build a reading list and browse your Goodreads library, shelved and searchable by Dewey Decimal number, with automatic book covers." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="{{asset:/favicon.svg}}" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#111111" />
<link rel="stylesheet" href="{{asset:/styles.css}}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 8.5C13 6.5 8 6 4.5 7v18C8 24 13 24.5 16 26.5 19 24.5 24 24 27.5 25V7C24 6 19 6.5 16 8.5Z" />
        <path d="M16 8.5v18" />
      </svg>
      <span>LIBRARY</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-tab="reading">Reading List</button>
      <button class="tab" data-tab="goodreads">Goodreads</button>
    </nav>
    <div class="count" id="count"></div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search title, author, subject — or a Dewey number" autocomplete="off" spellcheck="false" />
    </div>
    <div class="control-row ddc-row">
      <label class="field ddc-field">
        <span>Dewey</span>
        <input id="ddcInput" type="text" placeholder="e.g. 823.8 · 500 · 82x · 300-399" inputmode="decimal" autocomplete="off" spellcheck="false" />
      </label>
      <button id="ddcBrowse" type="button" class="act-btn">Find by category</button>
      <button id="ddcGuide" type="button" class="act-btn ghost">DDC guide</button>
    </div>
    <div class="control-row">
      <label class="field">
        <span>Author</span>
        <select id="authorFilter"><option value="">All</option></select>
      </label>
      <label class="field">
        <span>Status</span>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="read">Read</option>
          <option value="unread">Unread</option>
          <option value="primary">Primary source</option>
        </select>
      </label>
      <label class="field">
        <span>Sort</span>
        <select id="sortBy">
          <option value="ddc">Shelf order (Dewey)</option>
          <option value="curated">Curated</option>
          <option value="title">Title A–Z</option>
          <option value="author">Author A–Z</option>
        </select>
      </label>
      <label class="field toggle">
        <span>View</span>
        <button id="viewToggle" type="button" data-view="grid">Grid</button>
      </label>
      <div class="field-actions">
        <button id="importMore" type="button" class="act-btn" hidden>Import CSV</button>
        <button id="addBook" type="button" class="act-btn act-add">+ Add book</button>
      </div>
    </div>
    <div class="tagbar" id="tagbar"></div>
  </div>
  <input type="file" id="importMoreInput" accept=".csv,text/csv" hidden />

  <main id="results" class="grid"></main>

  <div id="empty" class="empty" hidden>
    <p>No books match your filters.</p>
  </div>

  <!-- Goodreads import overlay content is injected when needed -->

  <footer class="foot">
    <span id="footNote"></span>
    <span id="syncState" class="sync-state" hidden></span>
    <button id="exportBtn" type="button" class="store-btn" title="Download the whole library as Markdown">Export backup</button>
    <button id="clearBtn" type="button" class="store-btn danger">Clear library…</button>
    <button id="logoutBtn" type="button" class="store-btn" hidden>Log out</button>
  </footer>

  <div id="modalHost"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="{{asset:/shared/dewey.js}}"></script>
  <script src="{{asset:/shared/ddc.js}}"></script>
  <script src="{{asset:/shared/dedupe.js}}"></script>
  <script src="{{asset:/app.js}}"></script>
</body>
</html>
